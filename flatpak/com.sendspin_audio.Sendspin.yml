# Built inside a release's source tarball, where third_party/fetched/ has what the build would
# download: flatpak-builder gives a build no network.
#
#     flatpak-builder --user --install-deps-from=flathub --force-clean build-flatpak \
#         flatpak/com.sendspin_audio.Sendspin.yml
#
# Flathub's is this one with the tarball as its source: scripts/flathub-manifest.sh, which
# drops this header and replaces the last two lines.

app-id: com.sendspin_audio.Sendspin
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: sendspin-for-linux
# docs/SPEC.md, "Install methods". The MPRIS name is granted to every app; autostart is the
# Background portal's and notifications the notification portal's, which need no permission.
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
  - --filesystem=xdg-run/pipewire-0
  - --talk-name=org.kde.StatusNotifierWatcher
  - --system-talk-name=org.freedesktop.Avahi
# The packages' autostart entry, and their updater, which Flatpak is here: nothing reads them
cleanup:
  - /etc
  - /libexec
  - /share/polkit-1
  - /share/sendspin-for-linux
modules:
  - name: sendspin-for-linux
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      # Where Flatpak apps keep their licenses
      - -DCMAKE_INSTALL_DOCDIR=/app/share/licenses/com.sendspin_audio.Sendspin
    sources:
      - type: dir
        path: ..
