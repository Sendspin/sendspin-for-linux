# A version tag builds the artifacts and attaches them to a draft release, then signs their
# checksums once the package-signing environment's reviewer lets it. Publishing the draft is a
# person's step, after that.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The version has one home, project(VERSION) in CMakeLists.txt: the tag has to name it
  version:
    name: Tag matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          version=$(sed -n 's/^project(.* VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match project(VERSION) $version"
            exit 1
          fi

  packages:
    needs: version
    uses: ./.github/workflows/packages.yml

  release:
    name: Draft release
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # gh run download
      actions: read
      # The attestation
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.packages.outputs.version }}
    steps:
      # An artifact uploaded seconds ago can be missing from the run's list, and a release short
      # of a file would still look done: ask again until all of them are there
      - name: Download the artifacts
        run: |
          expected="com.sendspin_audio.Sendspin.yml
          sendspin-for-linux-$VERSION-archlinux-x86_64.pkg.tar.zst
          sendspin-for-linux-$VERSION-debian13-amd64.deb
          sendspin-for-linux-$VERSION-fedora44-x86_64.rpm
          sendspin-for-linux-$VERSION-fedora45-x86_64.rpm
          sendspin-for-linux-$VERSION-ubuntu26.04-amd64.deb
          sendspin-for-linux-$VERSION-x86_64.flatpak
          sendspin-for-linux-$VERSION.tar.xz"
          for try in 1 2 3 4 5 6; do
            gh run download "$GITHUB_RUN_ID" --dir "try$try" \
              --pattern source --pattern 'package-*' --pattern flatpak
            actual=$(find "try$try" -type f -printf '%f\n' | LC_ALL=C sort)
            [ "$actual" != "$expected" ] || break
            sleep 10
          done
          if [ "$actual" != "$expected" ]; then
            echo "::error::the artifacts are not the release's files"
            echo "$actual"
            exit 1
          fi
          mkdir dist && find "try$try" -type f -exec mv {} dist/ \;
      # The package repositories sign only what carries this
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the draft
        run: |
          cd dist
          sha256sum -- * >SHA256SUMS
          cat SHA256SUMS
          # A run again for the same tag: the draft takes this run's files, a published
          # release is left as it is
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::$GITHUB_REF_NAME is already published. A release's files don't change: tag a new version."
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" --clobber -- *
            # The earlier run's signature is of the earlier files
            gh release delete-asset "$GITHUB_REF_NAME" SHA256SUMS.asc --yes 2>/dev/null || true
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes \
              --title "Sendspin for Linux $VERSION" -- *
          fi
      # To the job that signs it by the run, not by the draft, which anyone who may write to
      # the repository can change
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sums
          path: dist/SHA256SUMS
          if-no-files-found: error

  # What the app verifies an update with (docs/SPEC.md, "Updates"): the package repositories'
  # key over SHA256SUMS, and so over every file of the release
  sign:
    name: Sign the checksums
    needs: release
    runs-on: ubuntu-latest
    # Holds the key, behind a reviewer
    environment: package-signing
    permissions:
      contents: write
      # gh run download
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # No action runs beside the key: the checksums and the packaged public key come by gh
      - name: Sign SHA256SUMS and add the signature to the draft
        env:
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
          REPO_GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
        run: |
          published() {
            [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != true ]
          }
          refuse() {
            echo "::error::$GITHUB_REF_NAME is already published. A release's files don't change: tag a new version."
            exit 1
          }
          ! published || refuse
          # An artifact uploaded seconds ago can be missing from the run's list
          for try in 1 2 3 4 5 6; do
            gh run download "$GITHUB_RUN_ID" --name sums && break
            sleep 10
          done
          [ -s SHA256SUMS ] || { echo "::error::no SHA256SUMS from this run"; exit 1; }
          gh api "repos/$GH_REPO/contents/data/sendspin.asc?ref=$GITHUB_SHA" \
            -H "Accept: application/vnd.github.raw" >packaged.asc

          # The key lives only here, and goes with it
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          trap 'gpgconf --kill gpg-agent 2>/dev/null || true; rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$REPO_GPG_PASSPHRASE" >"$GNUPGHOME/passphrase"
          printf '%s\n' "$REPO_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          gpg --batch --pinentry-mode loopback --passphrase-file "$GNUPGHOME/passphrase" \
            --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS

          # As an installed app will: against the key its package carries, data/sendspin.asc.
          # A signature that key does not verify would only ever be refused
          gpg --batch --dearmor <packaged.asc >"$GNUPGHOME/packaged.gpg"
          if ! gpgv --keyring "$GNUPGHOME/packaged.gpg" SHA256SUMS.asc SHA256SUMS; then
            echo "::error::data/sendspin.asc is not the public half of the signing key"
            exit 1
          fi
          # Since this job started, somebody may have published it
          ! published || refuse
          gh release upload "$GITHUB_REF_NAME" --clobber SHA256SUMS.asc
