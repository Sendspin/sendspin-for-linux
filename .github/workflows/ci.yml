name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version CLAUDE.md names; output differs between releases
      - name: clang-format
        run: >-
          pipx run clang-format==20.1.8 --dry-run --Werror
          src/*.cpp src/*.h src/*/*.cpp src/*/*.h

  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora 44
            image: registry.fedoraproject.org/fedora:44
            install: >-
              dnf -y install cmake ninja-build gcc-c++ git patch pkgconf-pkg-config xz
              qt6-qtbase-devel qt6-qtdeclarative-devel pipewire-devel avahi-devel openssl-devel
              dbus-daemon pipewire pipewire-utils wireplumber gnupg2
          - name: Fedora 44 (ASan + UBSan)
            image: registry.fedoraproject.org/fedora:44
            install: >-
              dnf -y install cmake ninja-build gcc-c++ git patch pkgconf-pkg-config xz
              qt6-qtbase-devel qt6-qtdeclarative-devel pipewire-devel avahi-devel openssl-devel
              dbus-daemon pipewire pipewire-utils wireplumber gnupg2 libasan libubsan
            configure: -DSENDSPIN_SANITIZE=ON
          # The floor: the oldest Qt and PipeWire we support
          - name: Debian 13
            image: debian:13
            install: >-
              apt-get update && apt-get install -y --no-install-recommends
              ca-certificates cmake ninja-build g++ git patch pkg-config xz-utils
              qt6-base-dev qt6-declarative-dev libpipewire-0.3-dev libavahi-client-dev libssl-dev
              dbus-daemon pipewire pipewire-bin wireplumber gpgv
          - name: Ubuntu 26.04
            image: ubuntu:26.04
            install: >-
              apt-get update && apt-get install -y --no-install-recommends
              ca-certificates cmake ninja-build g++ git patch pkg-config xz-utils
              qt6-base-dev qt6-declarative-dev libpipewire-0.3-dev libavahi-client-dev libssl-dev
              dbus-daemon pipewire pipewire-bin wireplumber gpgv
    steps:
      - name: Install dependencies
        run: ${{ matrix.install }}
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Ninja ${{ matrix.configure }}
      - name: Build
        run: cmake --build build
      # Verbose, so the log shows the audio tests ran rather than skipped
      - name: Test
        run: ci/start-pipewire.sh ctest --test-dir build --output-on-failure --verbose

  interop:
    name: Interop
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 30
    steps:
      # The build's packages, then uv for the tests and the libraries the player release links
      - name: Install dependencies
        run: >-
          dnf -y install cmake ninja-build gcc-c++ git patch pkgconf-pkg-config xz
          qt6-qtbase-devel qt6-qtdeclarative-devel pipewire-devel avahi-devel openssl-devel
          dbus-daemon pipewire pipewire-utils wireplumber
          uv portaudio avahi-compat-libdns_sd
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Ninja -DBUILD_TESTING=OFF
      - name: Build
        run: cmake --build build
      # The app against sendspin-cpp-cli and aiosendspin, both pinned in tests/interop
      - name: Test
        timeout-minutes: 10
        run: tests/interop/run.sh

  packages:
    name: Packages
    uses: ./.github/workflows/packages.yml
